name: Release hyphenation packs

on:
  workflow_dispatch:
    inputs:
      firmware_ref:
        description: Full firmware commit SHA containing the pack converter
        required: true
        type: string
      tag:
        description: New immutable release tag, for example hyphenation-v1-d81cc50
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crosspoint-reader/crosspoint-reader
          ref: ${{ inputs.firmware_ref }}
          path: firmware
      - uses: actions/checkout@v4
        with:
          repository: typst/hypher
          ref: d81cc506416bffef2a75ee2dc969d4b41bc36613
          path: hypher
      - name: Verify pinned inputs and build packs
        env:
          FIRMWARE_REF: ${{ inputs.firmware_ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(git -C firmware rev-parse HEAD)" = "$FIRMWARE_REF"
          [[ "$RELEASE_TAG" =~ ^hyphenation-v[0-9]+-[0-9a-f]{7,40}$ ]]
          bash build.sh firmware hypher "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --title "$RELEASE_TAG" \
            --notes "Hyphenation packs built from pinned Typst Hypher source. See pattern-sources.zip for per-pattern copyright and license notices." \
            --latest
